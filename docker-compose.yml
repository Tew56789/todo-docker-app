version: "3.9"

services:
  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: npm run dev
    working_dir: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: todo-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: npm start
    working_dir: /app
    depends_on:
      - backend
